name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include what you expected instead.
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, request payloads, dataset snippet (remove any real PII/secrets).
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: "`GET /health` -> version, or `llmops-eval --version`"
    validations: { required: true }
  - type: dropdown
    id: install
    attributes:
      label: How are you running it?
      options: [Docker, Docker Compose, Render / HF Spaces, Local venv, CI only]
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Logs / report excerpt
      render: shell
